[workspace]
resolver = "2"
members = [
    "crates/sim",
    "crates/protocol",
    "crates/pack-schema",
    "crates/cargen",
    "crates/ai",
    "crates/trackgen",
    "crates/server",
    "crates/client",
    "crates/render",
    "crates/content",
    "crates/example-model",
    "crates/test-client",
    "crates/trace-compare",
    "crates/xtask",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

# Generated tracks involve millions of noise evaluations; keep them quick in debug test runs.
[profile.dev.package.racer-trackgen]
opt-level = 3
