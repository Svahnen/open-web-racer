[package]
name = "racer-client"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "racer_client"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
racer-sim = { path = "../sim", version = "=0.1.0" }
racer-ai = { path = "../ai", version = "=0.1.0" }
racer-render = { path = "../render", version = "=0.1.0" }
racer-protocol = { path = "../protocol", version = "=0.1.0" }
racer-content = { path = "../content", version = "=0.1.0" }
sha2 = "=0.10.9"
serde_json = "=1.0.140"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement"] }

[lints]
workspace = true
