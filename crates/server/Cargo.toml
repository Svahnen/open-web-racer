[package]
name = "racer-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# Explicit project-owned synthetic catalog for multiplayer acceptance tests only.
synthetic-multiplayer-test = []

[lib]
name = "racer_server"
path = "src/lib.rs"

[dependencies]
axum = { version = "=0.8.4", features = ["ws"] }
futures-util = "=0.3.31"
racer-protocol = { path = "../protocol", version = "=0.1.0" }
racer-content = { path = "../content", version = "=0.1.0" }
racer-sim = { path = "../sim", version = "=0.1.0" }
racer-ai = { path = "../ai", version = "=0.1.0" }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
sha2 = "=0.10.9"
tokio = { version = "=1.45.1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal"] }
tower-http = { version = "=0.6.6", features = ["fs", "limit", "trace"] }

[dev-dependencies]
tokio-tungstenite = "=0.26.2"
racer-example-model = { path = "../example-model", version = "=0.1.0" }
# Enables the project-owned synthetic catalog for the websocket acceptance test.
racer-server = { path = ".", features = ["synthetic-multiplayer-test"] }

[[example]]
name = "synthetic-multiplayer-server"
path = "examples/synthetic_multiplayer_server.rs"
required-features = ["synthetic-multiplayer-test"]

[lints]
workspace = true
